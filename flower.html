<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build a Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3a1438; --pink: #ff4f93; --soft: #ffd6ea; --cream: #fff7ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: 'Press Start 2P', ui-monospace, 'Courier New', monospace; color: var(--ink);
    background: radial-gradient(circle at 2px 2px, rgba(255,255,255,.6) 2px, transparent 0) 0 0 / 28px 28px,
                radial-gradient(120% 90% at 50% 20%, #ffd6ea, #ffb3d9 60%, #f79ac6);
    padding: clamp(10px, 2vh, 20px); display: flex; flex-direction: column; gap: clamp(10px, 2vh, 18px); min-height: 100vh; }

  .backlink { position: fixed; left: clamp(10px, 2vw, 22px); top: clamp(10px, 2vh, 22px); z-index: 10;
    display: inline-flex; align-items: center; gap: 8px; font-size: clamp(9px, 1.2vw, 13px); min-height: 44px; padding: 0 16px; }
  .backlink .arw { font-size: 1.3em; line-height: 1; }
  header { padding-top: clamp(0px, 1vh, 10px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  h1 { font-size: clamp(14px, 2.6vw, 26px); margin: 0; letter-spacing: .14em; color: #ff2e86;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(58,20,56,.28); }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  .btn { font: inherit; font-size: clamp(8px, 1.05vw, 11px); letter-spacing: .08em; cursor: pointer; line-height: 1;
    min-height: 40px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; background: var(--pink); border: 0; text-decoration: none;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 5px 6px 0 rgba(58,20,56,.28); }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translate(3px, 4px); box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 5px; }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.on { background: var(--ink); color: #fff; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 380px); gap: clamp(16px, 2.4vw, 32px);
    align-items: start; flex: 1; min-height: 0; }
  .stage { display: grid; place-items: center; min-width: 0; }
  #art { image-rendering: pixelated; background: #fff; max-width: 100%; max-height: 72vh; touch-action: none; cursor: crosshair;
    box-shadow: 0 -6px 0 var(--ink), 0 6px 0 var(--ink), -6px 0 0 var(--ink), 6px 0 0 var(--ink), 10px 12px 0 rgba(58,20,56,.28); }
  #art.dragging { cursor: grabbing; }

  .panel { display: flex; flex-direction: column; gap: 16px; max-height: 80vh; overflow: auto; padding: 2px 6px 6px 2px; }
  .box { background: #fff; padding: 16px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 6px 8px 0 rgba(58,20,56,.22); }
  .box h2 { font-size: 9px; letter-spacing: .16em; margin: 0; color: #c2185b; font-weight: normal; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tray button { background: var(--cream); border: 0; padding: 6px; cursor: pointer; aspect-ratio: 1;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
  .tray button canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .tray button.on { background: var(--soft); box-shadow: 0 -3px 0 var(--pink), 0 3px 0 var(--pink), -3px 0 0 var(--pink), 3px 0 0 var(--pink); }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1; border: 0; cursor: pointer; padding: 0; transition: transform .12s;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
  .sw:hover { transform: scale(1.14); }
  .sw:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }
  .targets { display: flex; flex-wrap: wrap; gap: 10px; }
  .targets .btn { min-height: 34px; padding: 0 11px; font-size: 8px; }
  .hint { font-size: 8px; line-height: 1.9; color: #7a5570; margin: 0; }
  .sel-name { font-size: 8px; color: #c2185b; margin: 0; letter-spacing: .1em; }


  .soundbtn { position: fixed; right: clamp(10px, 2vw, 20px); top: clamp(10px, 2vh, 20px); z-index: 60;
    min-height: 40px; padding: 0 14px; font-size: clamp(8px, 1.1vw, 11px); letter-spacing: .1em; cursor: pointer;
    color: #3a1438; background: #fff; border: 0; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 4px 5px 0 rgba(58,20,56,.25); }
  .soundbtn.off { background: #3a1438; color: #ff9cc4; }
  .soundbtn:active { transform: translate(3px, 4px); }
  .soundpanel { position: fixed; right: clamp(10px, 2vw, 20px); top: calc(clamp(10px, 2vh, 20px) + 52px); z-index: 60;
    display: none; flex-direction: column; gap: 10px; padding: 14px; background: #fff; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 5px 6px 0 rgba(58,20,56,.25); }
  .soundpanel.open { display: flex; }
  .soundpanel .lbl { font-size: 8px; letter-spacing: .12em; color: #a4567f; display: flex; gap: 8px; justify-content: space-between; }
  .soundpanel .lbl b { font-weight: normal; color: #ff2e86; }
  .soundpanel input[type=range] { -webkit-appearance: none; appearance: none; width: 130px; height: 14px; background: #f3dbe7;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-moz-range-thumb { border: 0; border-radius: 0; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel .mutebtn { font: inherit; font-size: 8px; letter-spacing: .1em; padding: 9px 10px; cursor: pointer; border: 0;
    color: #3a1438; background: #ffe3f0; box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; }
  .soundpanel { position: fixed; right: clamp(10px, 2vw, 20px); top: calc(clamp(10px, 2vh, 20px) + 52px); z-index: 60;
    display: none; flex-direction: column; gap: 10px; padding: 14px; background: #fff; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 5px 6px 0 rgba(58,20,56,.25); }
  .soundpanel.open { display: flex; }
  .soundpanel .lbl { font-size: 8px; letter-spacing: .12em; color: #a4567f; display: flex; gap: 8px; justify-content: space-between; }
  .soundpanel .lbl b { font-weight: normal; color: #ff2e86; }
  .soundpanel input[type=range] { -webkit-appearance: none; appearance: none; width: 130px; height: 14px; background: #f3dbe7;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-moz-range-thumb { border: 0; border-radius: 0; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel .mutebtn { font: inherit; font-size: 8px; letter-spacing: .1em; padding: 9px 10px; cursor: pointer; border: 0;
    color: #3a1438; background: #ffe3f0; box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; }

  @media (max-width: 860px) {
    .backlink { position: static; margin: 0 auto; }
    main { grid-template-columns: 1fr; }
    #art { max-height: 50vh; }
    .panel { max-height: none; overflow: visible; }
    .swatches { grid-template-columns: repeat(7, 1fr); }
  }
</style>
</head>
<body>
<a class="btn ghost backlink" href="index.html#hub" aria-label="Back to the hub"><span class="arw">&#11013;</span> HUB</a>

<header>
  <h1>&#10022; BUILD A BOUQUET &#10022;</h1>
  <div class="toolbar">
    <button class="btn ghost" id="fmtPortrait">PHONE 1080&times;2400</button>
    <button class="btn ghost" id="fmtLandscape">WIDE 1920&times;1080</button>
    <button class="btn" id="save1">SAVE 1080&times;2400</button>
    <button class="btn" id="save2">SAVE 1920&times;1080</button>
  </div>
</header>

<main>
  <div class="stage"><canvas id="art"></canvas></div>

  <div class="panel">
    <div class="box">
      <h2>FLOWERS &mdash; tap one, then tap the picture</h2>
      <div class="tray" id="tray"></div>
      <p class="hint">Drag a flower to move it. Tapping a flower selects it and brings it to the front.</p>
    </div>

    <div class="box">
      <h2>COLOUR</h2>
      <p class="sel-name" id="selName">nothing selected</p>
      <div class="targets" id="targets"></div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="box">
      <h2>SELECTED FLOWER</h2>
      <div class="grid2">
        <button class="btn ghost" id="smaller">- SIZE</button>
        <button class="btn ghost" id="bigger">+ SIZE</button>
        <button class="btn ghost" id="sendBack">SEND BACK</button>
        <button class="btn" id="del">DELETE</button>
      </div>
    </div>

    <div class="box">
      <button class="btn ghost" id="reset">START OVER</button>
    </div>
  </div>
</main>

    wrap: 'WRAP', inner: 'INNER PAPER', ribbon: 'RIBBON', bg: 'BACKGROUND',
  };
  const targetsEl = document.getElementById('targets');
  function syncPanel() {
    const f = selected != null ? S.flowers[selected] : null;
    document.getElementById('selName').textContent = f ? ('selected: ' + f.type) : 'nothing selected (painting the wrap)';
    const keys = f ? ['petal', 'centre', 'green', 'wrap', 'inner', 'ribbon', 'bg'] : ['wrap', 'inner', 'ribbon', 'bg'];
    if (!keys.includes(target)) target = keys[0];
    targetsEl.innerHTML = '';
    keys.forEach(k => {
      const b = document.createElement('button');
      b.className = 'btn ghost' + (k === target ? ' on' : '');
      b.textContent = TARGETS[k];
      b.addEventListener('click', () => { target = k; syncPanel(); });
      targetsEl.appendChild(b);
    });
  }
  const swatches = document.getElementById('swatches');
  PALETTE.forEach(([name, hex]) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = hex; b.title = name; b.setAttribute('aria-label', name);
    b.addEventListener('click', () => {
      const f = selected != null ? S.flowers[selected] : null;
      Sound.play('paint_pop_' + (1 + Math.floor(Math.random() * 4)), .35);
      if (target === 'bg') S.bg = hex;
      else if (['wrap', 'inner', 'ribbon'].includes(target)) S.wrap[target] = hex;
      else if (f) { f[target] = hex; lastColours[target] = hex; }
      render();
    });
    swatches.appendChild(b);
  });

  const withSel = fn => () => { if (selected != null && S.flowers[selected]) { fn(S.flowers[selected]); render(); } };
  document.getElementById('bigger').addEventListener('click', withSel(f => f.s = Math.min(2.4, f.s + .2)));
  document.getElementById('smaller').addEventListener('click', withSel(f => f.s = Math.max(.6, f.s - .2)));
  document.getElementById('sendBack').addEventListener('click', () => {
    if (selected == null) return;
    const f = S.flowers.splice(selected, 1)[0]; S.flowers.unshift(f); selected = 0; render();
  });
  function removeSelected() {
    if (selected == null) return;
    S.flowers.splice(selected, 1); selected = null; syncPanel(); render();
  }
  document.getElementById('del').addEventListener('click', removeSelected);
  addEventListener('keydown', e => {
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
    if (e.key === 'Escape') { armed = null; selected = null; [...tray.children].forEach(c => c.classList.remove('on')); syncPanel(); render(); }
  });
  document.getElementById('reset').addEventListener('click', () => {
    const fmt = S.format; S = START(); S.format = fmt; selected = null; armed = null;
    [...tray.children].forEach(c => c.classList.remove('on'));
    syncPanel(); render();
  });

  /* ---------- format + saving ---------- */
  function setFormat(f) {
    S.format = f;
    document.getElementById('fmtPortrait').classList.toggle('on', f === 'portrait');
    document.getElementById('fmtLandscape').classList.toggle('on', f === 'landscape');
    render();
  }
  document.getElementById('fmtPortrait').addEventListener('click', () => setFormat('portrait'));
  document.getElementById('fmtLandscape').addEventListener('click', () => setFormat('landscape'));

  function save(fmt) {
    Sound.play('save_chime', .6);
    const cv = document.createElement('canvas');
    drawScene(cv, fmt);
    cv.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `bouquet-${FORMATS[fmt].w}x${FORMATS[fmt].h}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }
  document.getElementById('save1').addEventListener('click', () => save('portrait'));
  document.getElementById('save2').addEventListener('click', () => save('landscape'));

  setFormat('portrait');
  syncPanel();
})();
</script>
</body>
</html>
