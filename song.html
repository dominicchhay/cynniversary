<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songs that remind me of you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3a1438; --pink: #ff4f93; --shell: #f3e2e2; --shell-edge: #d9bfc2; --face: #2b2029; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: 'Press Start 2P', ui-monospace, 'Courier New', monospace; color: var(--ink); min-height: 100vh; overflow-x: hidden;
    background: radial-gradient(circle at 2px 2px, rgba(255,255,255,.6) 2px, transparent 0) 0 0 / 28px 28px,
                radial-gradient(120% 90% at 50% 20%, #ffd6ea, #ffb3d9 60%, #f79ac6);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 3.4vh, 34px);
    padding: clamp(16px, 3vh, 28px); }

  .btn { font: inherit; font-size: clamp(9px, 1.2vw, 12px); letter-spacing: .08em; cursor: pointer; line-height: 1;
    min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    color: #3a1438; background: #fff; border: 0; text-decoration: none;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 5px 6px 0 rgba(58,20,56,.28); }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translate(3px, 4px); box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 5px; }
  .backlink { position: fixed; left: clamp(10px, 2vw, 22px); top: clamp(10px, 2vh, 22px); z-index: 20; }
  .backlink .arw { font-size: 1.3em; }

  h1 { font-size: clamp(14px, 2.6vw, 30px); margin: 0; text-align: center; line-height: 1.7; position: relative;
    color: #ff2e86; text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(58,20,56,.28); }
  h1 span { background: linear-gradient(100deg, #ff2e86 0 43%, #ffb3d9 47%, #fff 50%, #ffb3d9 53%, #ff2e86 57% 100%);
    background-size: 320% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(3px 3px 0 #fff); animation: shine 3.6s linear infinite; }
  @keyframes shine { from { background-position: 180% 0; } to { background-position: -80% 0; } }

  /* ---------- the player shell (chunky pixel / Y2K chrome) ---------- */
  .playerwrap { position: relative; max-width: 100%; }
  .player { position: relative; width: min(520px, 94vw); padding: 20px 20px 26px;
    background: linear-gradient(170deg, #fff 0 12%, var(--shell) 40%, #e9cfd4 100%);
    box-shadow: 0 -8px 0 var(--ink), 0 8px 0 var(--ink), -8px 0 0 var(--ink), 8px 0 0 var(--ink),
                0 -4px 0 4px rgba(255,255,255,.9) inset, 14px 16px 0 rgba(58,20,56,.28); }
  .player::before { content: ''; position: absolute; inset: 6px; border: 2px solid rgba(255,255,255,.75); pointer-events: none; }
  .player.playing { animation: shell-glow 2.4s ease-in-out infinite; }
  @keyframes shell-glow {
    0%, 100% { box-shadow: 0 -8px 0 var(--ink), 0 8px 0 var(--ink), -8px 0 0 var(--ink), 8px 0 0 var(--ink), 14px 16px 0 rgba(58,20,56,.28); }
    50% { box-shadow: 0 -8px 0 var(--ink), 0 8px 0 var(--ink), -8px 0 0 var(--ink), 8px 0 0 var(--ink), 14px 16px 0 rgba(58,20,56,.28), 0 0 34px 6px rgba(255,79,147,.5); }
  }
  /* pixel stars pinned to the corners */
  .decal { position: absolute; width: 22px; height: 40px; background-size: 100% 100%; image-rendering: pixelated;
    background-repeat: no-repeat; animation: twinkle 2.6s steps(1) infinite; }
  .decal.tl { left: -14px; top: -18px; } .decal.tr { right: -14px; top: -18px; animation-delay: .9s; }
  .decal.bl { left: -14px; bottom: -18px; animation-delay: 1.4s; } .decal.br { right: -14px; bottom: -18px; animation-delay: .4s; }
  @keyframes twinkle { 0%, 55% { opacity: 1; transform: scale(1); } 65% { opacity: .3; transform: scale(.7); } 80% { opacity: 1; transform: scale(1.2); } }

  .art { position: relative; aspect-ratio: 1; overflow: hidden; isolation: isolate; display: grid; place-items: center;
    background: linear-gradient(170deg, #ffd9e4, #f3a6bd 55%, #e98fb0);
    box-shadow: 0 -5px 0 var(--ink), 0 5px 0 var(--ink), -5px 0 0 var(--ink), 5px 0 0 var(--ink); }
  .art > img { width: 100%; height: 100%; object-fit: cover; display: none; image-rendering: pixelated; }
  .ytwrap { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .5s; }
  .ytwrap.live { opacity: 1; }
  .ytwrap iframe { position: absolute; top: 50%; left: 50%; width: 100%; height: 178%; transform: translate(-50%, -50%); border: 0; }
  .art.has-video .placeholder { display: none; }
  .art.has-cover > img { display: block; }
  .art.has-cover .placeholder { display: none; }
  /* sweeping sheen + scanlines over the artwork */
  .art::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.14) 0 2px, transparent 2px 5px); }
  .sheen { position: absolute; inset: -40%; pointer-events: none; opacity: .75;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.7) 50%, transparent 60%);
    background-size: 260% 100%; animation: sweep 5s linear infinite; }
  @keyframes sweep { from { background-position: 180% 0; } to { background-position: -80% 0; } }

  .placeholder { display: grid; place-items: center; gap: 16px; text-align: center; padding: 16px; z-index: 2; }
  .placeholder .note { width: clamp(52px, 13vw, 86px); image-rendering: pixelated;
    filter: drop-shadow(4px 4px 0 rgba(180,70,120,.45)); animation: notebob 1.6s ease-in-out infinite; }
  .playing .placeholder .note { animation-duration: .5s; }
  @keyframes notebob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
  .placeholder span { font-size: 9px; line-height: 2; color: #8d4a67; }

  /* notes puffing out of the artwork while a song plays */
  .puffs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; opacity: 0; transition: opacity .4s; }
  .playing .puffs { opacity: 1; }
  .puffs i { position: absolute; bottom: -18px; width: 20px; height: 20px; background-size: 100% 100%;
    background-repeat: no-repeat; image-rendering: pixelated; animation: puff var(--d) linear var(--delay) infinite; }
  @keyframes puff { 0% { transform: translateY(0) rotate(-8deg); opacity: 0; } 15% { opacity: 1; }
    80% { opacity: 1; } 100% { transform: translateY(-260px) translateX(var(--dx)) rotate(14deg); opacity: 0; } }

  /* chunky equaliser, driven by the real audio when it can be */
  .eq { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: flex-end; gap: 5px; height: 46px; z-index: 4;
    opacity: 0; transition: opacity .3s; }
  .playing .eq { opacity: 1; }
  .eq i { width: 9px; height: 20%; background: #fff; box-shadow: 0 0 0 3px rgba(155,70,105,.45); transition: height .08s linear; }

  .meta { margin: 20px 4px 14px; min-height: 54px; }
  .meta .title { font-size: 13px; line-height: 1.7; word-break: break-word; }
  .playing .meta .title { animation: wobble 3s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  .meta .artist { font-size: 9px; line-height: 2; color: #9b6480; margin-top: 8px; }

  /* progress as pixel blocks */
  .bar { position: relative; height: 30px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .bar .track { height: 14px; width: 100%; background: #e4cdd1; box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
  .bar .fill { position: absolute; left: 0; height: 14px; width: 0;
    background: repeating-linear-gradient(90deg, var(--pink) 0 8px, #ff86b8 8px 12px); }
  .bar .knob { position: absolute; width: 18px; height: 24px; background: var(--face); left: 0; transform: translateX(-50%);
    box-shadow: -4px 0 0 rgba(255,255,255,.8) inset; }
  .times { display: flex; justify-content: space-between; font-size: 8px; color: #9b6480; margin: 10px 2px 18px; }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; gap: 6px; }
  .ctrl { background: #fff; border: 0; cursor: pointer; color: var(--face); display: grid; place-items: center;
    width: clamp(46px, 11vw, 58px); height: clamp(46px, 11vw, 58px); transition: transform .12s;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 4px 5px 0 rgba(58,20,56,.25); }
  .ctrl svg { width: 58%; height: auto; display: block; fill: currentColor; }
  .ctrl:hover { transform: translateY(-3px); background: #ffe3f0; }
  .ctrl:active { transform: translate(3px, 4px); box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink); }
  .ctrl:focus-visible { outline: 3px dashed var(--face); outline-offset: 4px; }
  .ctrl.on { color: #fff; background: var(--pink); }
  .ctrl.play { background: var(--face); color: #ffe3f0; width: clamp(62px, 15vw, 82px); height: clamp(62px, 15vw, 82px); }
  .ctrl.play:hover { background: #4a3646; }
  .player.playing .ctrl.play { animation: playpulse 1.2s ease-in-out infinite; }
  @keyframes playpulse { 0%, 100% { box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 4px 5px 0 rgba(58,20,56,.25); }
    50% { box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 0 0 22px 4px rgba(255,79,147,.65); } }
  .ctrl[disabled] { opacity: .4; cursor: not-allowed; transform: none; }

  /* hearts floating up beside the player */
  .floaters { position: absolute; inset: -40px min(-90px, 0px); pointer-events: none; overflow: hidden; z-index: -1; opacity: 0; transition: opacity .5s; }
  .playing .floaters, .player.playing ~ .floaters { opacity: 1; }
  .floaters i { position: absolute; bottom: -24px; width: 22px; height: 20px; background-size: 100% 100%;
    background-repeat: no-repeat; image-rendering: pixelated; animation: rise var(--d) linear var(--delay) infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.7); opacity: 0; } 12% { opacity: 1; }
    82% { opacity: 1; } 100% { transform: translateY(-88vh) translateX(var(--dx)) scale(1.15); opacity: 0; } }

    .counter { font-size: 9px; letter-spacing: .14em; color: #a4567f; margin: 0; }
  .out { text-decoration: none; }
  .note-line { font-size: 8px; line-height: 2.1; color: #a4567f; text-align: center; max-width: 46ch; }


  .soundbtn { position: fixed; right: clamp(10px, 2vw, 20px); top: clamp(10px, 2vh, 20px); z-index: 60;
    min-height: 40px; padding: 0 14px; font-size: clamp(8px, 1.1vw, 11px); letter-spacing: .1em; cursor: pointer;
    color: #3a1438; background: #fff; border: 0; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 4px 5px 0 rgba(58,20,56,.25); }
  .soundbtn.off { background: #3a1438; color: #ff9cc4; }
  .soundbtn:active { transform: translate(3px, 4px); }
  .soundpanel { position: fixed; right: clamp(10px, 2vw, 20px); top: calc(clamp(10px, 2vh, 20px) + 52px); z-index: 60;
    display: none; flex-direction: column; gap: 10px; padding: 14px; background: #fff; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 5px 6px 0 rgba(58,20,56,.25); }
  .soundpanel.open { display: flex; }
  .soundpanel .lbl { font-size: 8px; letter-spacing: .12em; color: #a4567f; display: flex; gap: 8px; justify-content: space-between; }
  .soundpanel .lbl b { font-weight: normal; color: #ff2e86; }
  .soundpanel input[type=range] { -webkit-appearance: none; appearance: none; width: 130px; height: 14px; background: #f3dbe7;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-moz-range-thumb { border: 0; border-radius: 0; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel .mutebtn { font: inherit; font-size: 8px; letter-spacing: .1em; padding: 9px 10px; cursor: pointer; border: 0;
    color: #3a1438; background: #ffe3f0; box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; }
  .soundpanel { position: fixed; right: clamp(10px, 2vw, 20px); top: calc(clamp(10px, 2vh, 20px) + 52px); z-index: 60;
    display: none; flex-direction: column; gap: 10px; padding: 14px; background: #fff; font-family: inherit;
    box-shadow: 0 -4px 0 #3a1438, 0 4px 0 #3a1438, -4px 0 0 #3a1438, 4px 0 0 #3a1438, 5px 6px 0 rgba(58,20,56,.25); }

    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel input[type=range]::-moz-range-thumb { border: 0; border-radius: 0; width: 16px; height: 22px; background: #ff4f93;
    box-shadow: 0 -3px 0 #3a1438, 0 3px 0 #3a1438, -3px 0 0 #3a1438, 3px 0 0 #3a1438; cursor: pointer; }
  .soundpanel .mutebtn { font: inherit; font-size: 8px; letter-spacing: .1em; padding: 9px 10px; cursor: pointer; border: 0;

  @media (max-width: 720px) {
    .backlink { position: static; align-self: flex-start; }
    .floaters { left: 0; right: 0; }
    .decal { display: none; }
  }

    <button class="ctrl" id="repeat" title="Repeat" aria-label="Repeat">

    </button>
  </div>
</section>
</div>

const Sound = (() => {

  let vol = Math.max(0, Math.min(1, parseFloat(store('sound:vol', '0.7'))));

    if (!name || muted || vol === 0 || !MUSIC[name]) return;

        },
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING) { playing = true; sync(); }
          if (e.data === YT.PlayerState.PAUSED) { playing = false; sync(); }
          if (e.data === YT.PlayerState.ENDED) {
            if (repeat) { yt.seekTo(startOf(i), true); yt.playVideo(); } else step(1);
          }
        },
        onError: () => {
          hint.textContent = "that one wouldn't play here - skipping on";
          setTimeout(() => step(1), 1200);
        },
      },
    });
  };
  const LOCAL = location.protocol === 'file:';
  (() => {
    if (LOCAL) {                       // YouTube refuses to play inside a page opened from a folder
      hint.innerHTML = 'YouTube will not play in a page opened straight from a folder.<br>' +
        'Put the site online (or run a local server) and the player works.<br>' +
        'Until then, WATCH ON YOUTUBE opens the song in a new tab.';
      art.classList.add('offline');
      return;
    }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => hint.textContent = 'no internet - the songs need a connection to play';
    document.head.appendChild(tag);
  })();

  /* ---------- progress, ticking along with the video ---------- */
  setInterval(() => {
    if (!ready || !yt.getDuration) return;
    const dur = yt.getDuration() || 0, cur = yt.getCurrentTime() || 0;
    const from = startOf(i), snip = snipOf(i);
    const endAt = snip ? Math.min(dur, from + snip) : dur;
    const span = Math.max(1, endAt - from);
    const p = Math.max(0, Math.min(1, (cur - from) / span)) * 100;
    fill.style.width = p + '%'; knob.style.left = p + '%';
    curEl.textContent = fmt(Math.max(0, cur - from));
    durEl.textContent = fmt(span);
    bar.setAttribute('aria-valuenow', Math.round(p));
    if (playing && snip && cur >= endAt - 0.25) step(1);        // snippet finished, move on
  }, 250);

  playBtn.addEventListener('click', () => { Sound.play('ui_confirm', .35); playing ? pause() : play(); });
  $('next').addEventListener('click', () => step(1));
  $('prev').addEventListener('click', () => {
    if (ready && yt.getCurrentTime && yt.getCurrentTime() - startOf(i) > 3) { yt.seekTo(startOf(i), true); return; }
    step(-1);
  });
  $('shuffle').addEventListener('click', e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); });
  $('repeat').addEventListener('click', e => { repeat = !repeat; e.currentTarget.classList.toggle('on', repeat); });

  /* scrubbing */
  const seek = ev => {
    if (!ready || !yt.getDuration()) return;
    const b = bar.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (ev.clientX - b.left) / b.width));
    const from = startOf(i), snip = snipOf(i);
    const span = (snip ? Math.min(yt.getDuration(), from + snip) : yt.getDuration()) - from;
    yt.seekTo(from + frac * span, true);
  };
  let scrubbing = false;
  bar.addEventListener('pointerdown', e => { scrubbing = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => scrubbing && seek(e));
  bar.addEventListener('pointerup', () => scrubbing = false);

  addEventListener('keydown', e => {
    if (e.target.closest('button, .bar')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  buildList();
  sync();
  paintMeta();
  if (LOCAL) [playBtn, $('shuffle'), $('repeat')].forEach(b => b.disabled = true);
  [playBtn, $('shuffle'), $('repeat')].forEach(b => b.disabled = true);
  if (!hint.textContent) hint.textContent = 'loading the player...';
})();
</script>
</body>
</html>
